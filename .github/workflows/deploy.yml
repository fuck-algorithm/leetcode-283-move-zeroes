name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download recent Pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'success',
              per_page: 30,
            });
            const previousRuns = runs.data.workflow_runs.filter((run) =>
              run.head_sha !== context.sha && run.id !== context.runId
            );
            const destination = 'previous-pages/static';
            fs.mkdirSync(destination, { recursive: true });
            let preserved = 0;

            for (const run of previousRuns) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              const artifact = artifacts.data.artifacts.find((item) =>
                item.name === 'github-pages' && !item.expired
              );
              if (!artifact) continue;

              const download = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
                archive_format: 'zip',
              });
              const zipPath = `/tmp/pages-${run.id}.zip`;
              const runDirectory = `/tmp/pages-${run.id}`;
              fs.mkdirSync(runDirectory, { recursive: true });
              fs.writeFileSync(zipPath, Buffer.from(download.data));
              require('child_process').execFileSync(
                'unzip', ['-q', zipPath, 'artifact.tar', '-d', runDirectory]
              );
              const tarPath = path.join(runDirectory, 'artifact.tar');
              require('child_process').execFileSync('tar', ['-xf', tarPath, '-C', destination]);
              fs.rmSync(runDirectory, { recursive: true, force: true });
              fs.unlinkSync(zipPath);
              preserved += 1;
              core.info(`Recovered static assets from Pages run ${run.id}.`);
            }
            core.info(`Recovered assets from ${preserved} previous Pages artifacts.`);

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Preserve previous fingerprinted assets
        run: |
          mkdir -p build/static/js build/static/css
          if [ -d previous-pages/static/js ]; then
            find previous-pages/static/js -maxdepth 1 -type f \( -name 'main.*.js' -o -name 'main.*.js.map' -o -name '*.chunk.js' -o -name '*.chunk.js.map' \) -exec cp -n {} build/static/js/ \;
          fi
          if [ -d previous-pages/static/css ]; then
            find previous-pages/static/css -maxdepth 1 -type f \( -name 'main.*.css' -o -name 'main.*.css.map' \) -exec cp -n {} build/static/css/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
