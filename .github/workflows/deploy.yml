name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Checkout previous Pages assets
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-pages
          persist-credentials: false

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Preserve previous fingerprinted assets
        run: |
          mkdir -p build/static/js build/static/css
          if [ -d previous-pages/static/js ]; then
            find previous-pages/static/js -maxdepth 1 -type f \( -name 'main.*.js' -o -name 'main.*.js.map' -o -name '*.chunk.js' \) -exec cp -n {} build/static/js/ \;
          fi
          if [ -d previous-pages/static/css ]; then
            find previous-pages/static/css -maxdepth 1 -type f \( -name 'main.*.css' -o -name 'main.*.css.map' \) -exec cp -n {} build/static/css/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
