name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download previous Pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'success',
              per_page: 10,
            });
            const previousRun = runs.data.workflow_runs.find((run) =>
              run.head_sha !== context.sha && run.id !== context.runId
            );
            if (!previousRun) {
              core.info('No previous successful Pages deployment artifact found.');
              return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: previousRun.id,
            });
            const pagesArtifact = artifacts.data.artifacts.find((artifact) =>
              artifact.name === 'github-pages' && !artifact.expired
            );
            if (!pagesArtifact) {
              core.info('Previous Pages artifact is unavailable.');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: pagesArtifact.id,
              archive_format: 'zip',
            });
            require('fs').mkdirSync('previous-pages', { recursive: true });
            require('fs').writeFileSync('previous-pages/pages.zip', Buffer.from(download.data));
            core.info(`Downloaded Pages artifact from run ${previousRun.id}.`);

      - name: Extract previous Pages artifact
        run: |
          if [ -f previous-pages/pages.zip ]; then
            unzip -q previous-pages/pages.zip -d previous-pages/extracted
          fi

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build
        run: npm run build
        env:
          CI: false

      - name: Preserve previous fingerprinted assets
        run: |
          mkdir -p build/static/js build/static/css
          previous_static="previous-pages/extracted/static"
          if [ -d "$previous_static/js" ]; then
            find "$previous_static/js" -maxdepth 1 -type f \( -name 'main.*.js' -o -name 'main.*.js.map' -o -name '*.chunk.js' \) -exec cp -n {} build/static/js/ \;
          fi
          if [ -d "$previous_static/css" ]; then
            find "$previous_static/css" -maxdepth 1 -type f \( -name 'main.*.css' -o -name 'main.*.css.map' \) -exec cp -n {} build/static/css/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
