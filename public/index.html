<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="LeetCode 283 - Move Zeroes Algorithm Visualization"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>LeetCode 283 - Move Zeroes</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="startup-error" role="alert" hidden style="max-width: 36rem; margin: 12vh auto; padding: 2rem; color: #f8fafc; background: #1e293b; border-radius: 1rem; font: 16px/1.6 system-ui, sans-serif;">
      <h1 style="margin-top: 0">页面暂时无法加载</h1>
      <p>应用脚本可能未能加载，或浏览器缓存了旧版本。请刷新页面；如果仍无法打开，请清除本站缓存后重试。</p>
      <button type="button" onclick="window.location.reload()" style="padding: .65rem 1rem; cursor: pointer;">重新加载</button>
    </div>
    <script>
      (function () {
        var timeout = window.setTimeout(showStartupError, 10000);
        function showStartupError() {
          var root = document.getElementById('root');
          var error = document.getElementById('startup-error');
          if (root && error && !root.hasChildNodes()) {
            error.hidden = false;
          }
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target.tagName === 'SCRIPT') {
            showStartupError();
          }
        }, true);
        window.addEventListener('unhandledrejection', showStartupError);
        window.__appStarted = function () {
          var root = document.getElementById('root');
          var error = document.getElementById('startup-error');
          if (root && root.hasChildNodes()) {
            window.clearTimeout(timeout);
            if (error) {
              error.hidden = true;
            }
          }
        };
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
